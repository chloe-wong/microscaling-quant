[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microscaling-quant"
version = "0.1.0"
description = "Granular microscaling (MX) quantization ops. mxq."
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]      # torch.library.custom_op (mxq.matmul.compiled)

[project.optional-dependencies]
torchao = ["torchao>=0.16"]      # mxq.nn.torchao: MXQConfig behind torchao.quantize_
hf = ["transformers>=4.57"]      # mxq.nn attention core (patch with a (qk, pv) rule) and vector="bf16"
experiments = ["transformers>=4.57", "datasets>=4.4"]   # experiments/llm_ppl.py

[tool.setuptools.packages.find]
include = ["mxq*"]
