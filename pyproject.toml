[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microscaling-quant"
version = "0.1.0"
description = "Granular microscaling (MX) quantization ops. mxq."
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
torchao = ["torchao>=0.16"]      # mxq.nn.torchao: MXQConfig behind torchao.quantize_

[tool.setuptools.packages.find]
include = ["mxq*"]
